<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Users CRUD</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }
    .container { max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h1 { text-align: center; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .card h2 { margin-top: 0; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus { outline: 2px solid #3b82f6; border-color: #3b82f6; }
    .actions { margin-top: 14px; display: flex; gap: 10px; }
    button {
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
    }
    .btn-primary { background: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #6b7280; }
    .btn-edit { background: #f59e0b; padding: 6px 12px; }
    .btn-delete { background: #dc2626; padding: 6px 12px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
    .toolbar input { max-width: 260px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    th { background: #f9fafb; }
    .table-wrap { overflow-x: auto; }
    .empty { text-align: center; color: #6b7280; padding: 20px; }
    #message {
      display: none;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    #message.success { display: block; background: #dcfce7; color: #166534; }
    #message.error { display: block; background: #fee2e2; color: #991b1b; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Users CRUD</h1>

    <div id="message"></div>

    <!-- Add / Edit form -->
    <div class="card">
      <h2 id="formTitle">Add New User</h2>
      <form id="userForm">
        <div class="form-grid">
          <div>
            <label for="name">Name *</label>
            <input type="text" id="name" placeholder="Ali Khan" required />
          </div>
          <div>
            <label for="email">Email *</label>
            <input type="email" id="email" placeholder="ali@example.com" required />
          </div>
          <div>
            <label for="age">Age</label>
            <input type="number" id="age" placeholder="25" min="0" />
          </div>
          <div>
            <label for="city">City</label>
            <input type="text" id="city" placeholder="Multan" />
          </div>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submitBtn">Add User</button>
          <button type="button" class="btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Users table -->
    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0;">All Users</h2>
        <input type="text" id="search" placeholder="Search by name, email or city..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Age</th>
              <th>City</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Change this if your backend runs on a different port
    const API_URL = 'http://localhost:3000/users';

    const form = document.getElementById('userForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const ageInput = document.getElementById('age');
    const cityInput = document.getElementById('city');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const formTitle = document.getElementById('formTitle');
    const usersBody = document.getElementById('usersBody');
    const searchInput = document.getElementById('search');
    const messageBox = document.getElementById('message');

    let users = [];       // all users loaded from the server
    let editingId = null; // id of the user being edited (null = adding)
    let messageTimer;

    // ---------- Helpers ----------
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = type;
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => { messageBox.className = ''; }, 4000);
    }

    async function request(url, options) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
      return data;
    }

    // ---------- READ ----------
    async function loadUsers() {
      try {
        users = await request(API_URL);
        renderUsers();
      } catch (err) {
        usersBody.innerHTML = '<tr><td colspan="6" class="empty">Could not load users. Is the server running on ' + escapeHtml(API_URL) + '?</td></tr>';
        showMessage(err.message, 'error');
      }
    }

    function renderUsers() {
      const term = searchInput.value.trim().toLowerCase();
      const list = users.filter(u =>
        [u.name, u.email, u.city].some(v => String(v ?? '').toLowerCase().includes(term))
      );

      if (list.length === 0) {
        usersBody.innerHTML = '<tr><td colspan="6" class="empty">No users found.</td></tr>';
        return;
      }

      usersBody.innerHTML = list.map(u => `
        <tr>
          <td>${u.id}</td>
          <td>${escapeHtml(u.name)}</td>
          <td>${escapeHtml(u.email)}</td>
          <td>${escapeHtml(u.age)}</td>
          <td>${escapeHtml(u.city)}</td>
          <td>
            <button class="btn-edit" data-action="edit" data-id="${u.id}">Edit</button>
            <button class="btn-delete" data-action="delete" data-id="${u.id}">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    // ---------- CREATE / UPDATE ----------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        name: nameInput.value.trim(),
        email: emailInput.value.trim(),
        age: ageInput.value === '' ? null : parseInt(ageInput.value, 10),
        city: cityInput.value.trim() || null
      };

      try {
        if (editingId === null) {
          await request(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          showMessage('User added successfully', 'success');
        } else {
          await request(API_URL + '/' + editingId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          showMessage('User updated successfully', 'success');
        }
        resetForm();
        loadUsers();
      } catch (err) {
        showMessage(err.message, 'error');
      }
    });

    // ---------- Edit / Delete buttons ----------
    usersBody.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.dataset.id);

      if (btn.dataset.action === 'edit') {
        const user = users.find(u => u.id === id);
        if (!user) return;
        editingId = id;
        nameInput.value = user.name ?? '';
        emailInput.value = user.email ?? '';
        ageInput.value = user.age ?? '';
        cityInput.value = user.city ?? '';
        formTitle.textContent = 'Edit User #' + id;
        submitBtn.textContent = 'Update User';
        cancelBtn.style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // ---------- DELETE ----------
      if (btn.dataset.action === 'delete') {
        if (!confirm('Delete this user?')) return;
        try {
          await request(API_URL + '/' + id, { method: 'DELETE' });
          showMessage('User deleted', 'success');
          if (editingId === id) resetForm();
          loadUsers();
        } catch (err) {
          showMessage(err.message, 'error');
        }
      }
    });

    function resetForm() {
      form.reset();
      editingId = null;
      formTitle.textContent = 'Add New User';
      submitBtn.textContent = 'Add User';
      cancelBtn.style.display = 'none';
    }

    cancelBtn.addEventListener('click', resetForm);
    searchInput.addEventListener('input', renderUsers);

    // Load users when the page opens
    loadUsers();
  </script>
</body>
</html>
